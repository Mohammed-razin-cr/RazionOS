on: [push, workflow_dispatch]
name: RazionOS x86_64 ISO

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RazionOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize runtime submodules
        run: git submodule update --init kuroko bim
      - name: Pull Builder Image
        run: docker pull toaruos/build-tools:1.99.x
      - name: Run Builder
        run: docker run -v ${GITHUB_WORKSPACE}:/root/misaka -w /root/misaka -e LANG=C.UTF-8 -t toaruos/build-tools:1.99.x util/build-in-docker.sh
      - name: Upload RazionOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: razionos-x86_64-0.1-alpha
          path: |
            image.iso

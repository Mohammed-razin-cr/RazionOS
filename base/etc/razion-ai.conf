[engine]
local_first=1
cloud_fallback=1
allow_cloud=0
audit_enabled=1
audit_log=/var/log/razion-ai.log
provider_timeout_ms=5000

; Provider adapters are isolated PEX services. The current release ships the
; routing configuration and protocol, but does not enable cloud access or
; bundle a model. API credentials must never be stored in this file.

[provider.ollama]
enabled=1
class=local
priority=10
endpoint=razion-ai-provider-ollama
capabilities=text,search,system-read,task-propose,code,settings

[provider.openai]
enabled=0
class=cloud
priority=40
endpoint=razion-ai-provider-openai
capabilities=text,search,system-read,task-propose,code,settings

[provider.gemini]
enabled=0
class=cloud
priority=50
endpoint=razion-ai-provider-gemini
capabilities=text,search,system-read,task-propose,code,settings

[provider.groq]
enabled=0
class=cloud
priority=60
endpoint=razion-ai-provider-groq
capabilities=text,search,system-read,task-propose,code,settings

[provider.openrouter]
enabled=0
class=cloud
priority=70
endpoint=razion-ai-provider-openrouter
capabilities=text,search,system-read,task-propose,code,settings

[provider.huggingface]
enabled=0
class=cloud
priority=80
endpoint=razion-ai-provider-huggingface
capabilities=text,search,system-read,task-propose,code,settings
